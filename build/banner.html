<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1400px; height: 440px; }
  body {
    background: #04060a;
    font-family: 'URW Gothic', 'Adwaita Sans', 'Noto Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .bg { position: absolute; top: 0; left: 0; width: 1400px; height: 440px; object-fit: cover; }
  .scrim {
    position: absolute; top: 0; left: 0; width: 1400px; height: 440px;
    background:
      radial-gradient(70% 110% at 50% 50%, rgba(4,6,10,0.10) 0%, rgba(4,6,10,0.68) 62%, #04060a 100%),
      linear-gradient(90deg, #04060a 0%, transparent 22%, transparent 78%, #04060a 100%);
  }
  .stage {
    position: absolute; top: 0; left: 0; width: 1400px; height: 440px;
    display: flex; align-items: center; justify-content: center; gap: 54px;
  }
  svg.sigil { display: block; filter: drop-shadow(0 0 30px rgba(190, 214, 244, 0.40)); }
  .hair { width: 1px; height: 168px; background: linear-gradient(180deg, transparent, rgba(182,196,214,0.42), transparent); }
  .type { display: flex; flex-direction: column; }
  .word {
    font-size: 76px; letter-spacing: 26px; color: #eef3fa; line-height: 1;
    margin-left: 26px;
  }
  .rule {
    width: 470px; height: 1px; margin: 26px 0 0 26px;
    background: linear-gradient(90deg, rgba(182,196,214,0.66), transparent);
  }
  .tag {
    font-size: 14px; letter-spacing: 8.5px; color: #7f8b9c;
    margin: 20px 0 0 28px; text-transform: uppercase;
  }
</style>
</head>
<body>
<img class="bg" src="banner-bg.png">
<div class="scrim"></div>
<div class="stage">
  <svg class="sigil" width="118" height="189" viewBox="0 0 1000 1600">
    <defs>
      <mask id="mL"><rect width="1000" height="1600" fill="black"/><circle cx="500" cy="800" r="420" fill="white"/><circle cx="560.6" cy="800" r="438.6" fill="black"/></mask>
      <mask id="mR"><rect width="1000" height="1600" fill="black"/><circle cx="500" cy="800" r="420" fill="white"/><circle cx="439.4" cy="800" r="438.6" fill="black"/></mask>
      <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffffff"/>
        <stop offset="0.46" stop-color="#e2eaf5"/>
        <stop offset="1" stop-color="#9db0ca"/>
      </linearGradient>
    </defs>
    <g fill="url(#silver)">
      <rect width="1000" height="1600" mask="url(#mL)"/>
      <rect width="1000" height="1600" mask="url(#mR)"/>
      <path d="M500 40 C515 300 515 500 515 800 C515 1100 515 1300 500 1560 C485 1300 485 1100 485 800 C485 500 485 300 500 40 Z"/>
    </g>
  </svg>
  <div class="hair"></div>
  <div class="type">
    <div class="word">APHELION</div>
    <div class="rule"></div>
    <div class="tag">The far point of the orbit</div>
  </div>
</div>
</body>
</html>
