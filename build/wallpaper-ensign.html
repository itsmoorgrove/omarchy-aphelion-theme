<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; }
  body {
    background: #030508;
    font-family: 'URW Gothic', 'Adwaita Sans', 'Noto Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .bg {
    position: absolute; top: 0; left: 0; width: 1920px; height: 1080px;
    background: radial-gradient(115% 95% at 50% 44%, #10151d 0%, #080b10 44%, #030508 100%);
  }
  .halo {
    position: absolute; left: 50%; top: 44%; transform: translate(-50%, -50%);
    width: 1080px; height: 1080px; border-radius: 50%;
    background: radial-gradient(circle, rgba(146,170,203,0.11) 0%, rgba(146,170,203,0.035) 40%, transparent 68%);
  }
  .stage {
    position: absolute; top: 0; left: 0; width: 1920px; height: 1080px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .stack { display: flex; flex-direction: column; align-items: center; margin-top: -52px; }
  svg.sigil { display: block; filter: drop-shadow(0 0 34px rgba(190, 214, 244, 0.38)); }
  .word {
    font-size: 62px; letter-spacing: 28px; color: #e8edf4;
    margin: 62px 0 0 28px; line-height: 1;
  }
</style>
</head>
<body>
<div class="bg"></div>
<div class="halo"></div>
<div class="stage">
  <div class="stack">
    <svg class="sigil" width="168" height="269" viewBox="0 0 1000 1600">
      <defs>
        <mask id="mL"><rect width="1000" height="1600" fill="black"/><circle cx="500" cy="800" r="420" fill="white"/><circle cx="560.6" cy="800" r="438.6" fill="black"/></mask>
        <mask id="mR"><rect width="1000" height="1600" fill="black"/><circle cx="500" cy="800" r="420" fill="white"/><circle cx="439.4" cy="800" r="438.6" fill="black"/></mask>
        <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffffff"/>
          <stop offset="0.46" stop-color="#e2eaf5"/>
          <stop offset="1" stop-color="#9fb2cb"/>
        </linearGradient>
      </defs>
      <g fill="url(#silver)">
        <rect width="1000" height="1600" mask="url(#mL)"/>
        <rect width="1000" height="1600" mask="url(#mR)"/>
        <path d="M500 40 C515 300 515 500 515 800 C515 1100 515 1300 500 1560 C485 1300 485 1100 485 800 C485 500 485 300 500 40 Z"/>
      </g>
    </svg>
    <div class="word">APHELION</div>
  </div>
</div>
</body>
</html>
